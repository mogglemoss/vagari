[project]
name = "vagari"
version = "0.10.0"
description = "Anoikis Cartographic Bureau — a terminal wormhole chain mapper for EVE Online"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "textual>=8.2.8",
]

[project.scripts]
vagari = "vagari.main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.0",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
